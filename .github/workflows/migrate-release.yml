name: Migrate CLI Release

on:
    push:
        branches:
            - main
            - next
        paths: ['migrate/**']

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        defaults:
            run:
                working-directory: migrate

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            - name: Install dependencies
              run: npm ci

            - name: Run fixtures
              run: npm run fixtures

            # The CLI ships as a tarball on a GitHub release, so it needs no npm token:
            # npx https://github.com/<repo>/releases/download/migrate-v<version>/vue-components-migrate-<version>.tgz
            - name: Attach the CLI to a GitHub release if this version has none yet
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="migrate-v$VERSION"
                  case "$VERSION" in *-*) PRE=1 ;; *) PRE= ;; esac
                  # next only releases prereleases and main only release versions, so a beta never
                  # shows up as the stable CLI and a stable version is never released from next.
                  if [ "$GITHUB_REF_NAME" = "next" ] && [ -z "$PRE" ]; then
                      echo "::notice::$VERSION is not a prerelease, it is released from main"
                      exit 0
                  fi
                  if [ "$GITHUB_REF_NAME" = "main" ] && [ -n "$PRE" ]; then
                      echo "::notice::$VERSION is a prerelease, it is released from next"
                      exit 0
                  fi
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "$TAG already exists, skipping"
                      exit 0
                  fi
                  FILE="vue-components-migrate-$VERSION.tgz"
                  mv "$(npm pack --silent)" "$FILE"
                  URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
                  gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "Upgrade CLI $VERSION" \
                      --notes "npx $URL" ${PRE:+--prerelease}
